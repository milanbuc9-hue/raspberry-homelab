networks:
  smarthome:
    driver: bridge
    ipam:
      config: [{ subnet: 172.20.0.0/24 }]

services:
  # === DISCORD ===

  discord-bot:
    build: ./discord-bot
    container_name: discord-bot
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: "1291440051007389778"
      DISCORD_MEMBER_ROLE_ID: "1501721279684935886"
      DISCORD_WELCOME_CHANNEL_ID: "1503531781008134245"
      DISCORD_BOT_CHANNEL_ID: "1501720772186734724"
      DISCORD_ROLLEN_CHANNEL_ID: "1503531777124204615"
      DISCORD_VC_HUB_ID: "1503527719563038882"
      DISCORD_VC_CATEGORY_ID: ""
    networks: [smarthome]

  # === CORE INFRASTRUCTURE ===
  
  # tailscale: ENTFERNT — läuft als nativer systemd-Service (tailscaled)
  # Doppelte Installation blockierte /dev/net/tun → 25.000+ Crash-Neustarts

  # === HOME AUTOMATION ===
  
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/milan/docker_data/homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
      # Patch: fido2 win_api.py (Windows-only) bricht asyncssh-Import auf Linux/py3.14
      # -> ssh_command (HACS) laedt nicht. Stub wirft ImportError, den asyncssh abfaengt.
      - /home/milan/docker_data/ha-fido2-patch/win_api.py:/usr/local/lib/python3.14/site-packages/fido2/client/win_api.py:ro
    depends_on: [matter-server, openthread]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.5'
        reservations:
          memory: 768M

  openthread:
    image: openthread/otbr@sha256:0591371dae41c900536445cee25757da55cff11ffaaca1a4ee0a2a64a127bfd9
    container_name: openthread
    restart: unless-stopped
    network_mode: host
    privileged: true
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      - INFRA_IF_NAME=eth0
      - FIREWALL=0
      - BACKBONE_ROUTER=1
      - NAT64=0
    devices:
      - /dev/serial/by-id/usb-SMLIGHT_SMLIGHT_SLZB-07_ec4f065cbb18f01185dd6a7db887153e-if00-port0:/dev/ttyUSB0
    volumes:
      - /home/milan/docker_data/otbr:/var/lib/thread
    entrypoint: ["/bin/bash", "-c", "rm -f /var/run/otbr-agent.pid; exec /app/etc/docker/test/docker_entrypoint.sh \"$$@\"", "--"]
    command: --radio-url spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  otbr-web:
    image: alpine/socat@sha256:7460121640bff33376cd25006e45920a69dc5b6ac3339b6db36bfff5d373afca
    container_name: otbr-web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    network_mode: host
    command: tcp-listen:8088,fork,reuseaddr,bind=0.0.0.0 tcp:127.0.0.1:80

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    privileged: true
    security_opt: [apparmor:unconfined]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /home/milan/docker_data/matter:/data
      - /run/dbus:/run/dbus
    command: --storage-path /data --primary-interface eth0 --bluetooth-adapter 0
    depends_on: [openthread]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # === AUTOMATION & WORKFLOWS ===
  
  n8n-postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    restart: on-failure:5
    networks: [smarthome]
    # Port nur intern - kein expose nach außen nötig
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - /home/milan/docker_data/n8n-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    command: postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c max_connections=150 -c work_mem=4MB

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    user: "1000:1000"
    restart: on-failure:5
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks: [smarthome]
    ports: ["5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_METRICS: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - /home/milan/docker_data/n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 45s
      timeout: 10s
      retries: 2
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'
          pids: 512
        reservations:
          memory: 768M
    sysctls:
      - net.ipv4.tcp_fin_timeout=20
      - net.core.somaxconn=1024


  # === MONITORING & OBSERVABILITY ===
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - smarthome
    ports:
      - 8082:8080

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.cpu'
      - '--collector.thermal_zone'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: on-failure:5
    networks: [smarthome]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["9090:9090"]
    environment:
      - TZ=UTC
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - /home/milan/docker_data/prometheus:/prometheus
      - /home/milan/docker_data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/milan/docker_data/prometheus/rules:/etc/prometheus/rules:ro
      - /home/milan/docker_data/prometheus/ha_token.txt:/etc/prometheus/ha_token.txt:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 45s
      timeout: 10s
      retries: 2
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.5'
          pids: 256
        reservations:
          memory: 256M

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    networks: [smarthome]
    ports: ["9115:9115"]
    volumes:
      - /home/milan/docker_data/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    command: --config.file=/etc/blackbox_exporter/config.yml
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks: [smarthome]
    ports: ["9093:9093"]
    environment:
      - TZ=UTC
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - /home/milan/docker_data/alertmanager:/alertmanager
      - /home/milan/docker_data/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M

  alert-telegram-bridge:
    build:
      context: .
      dockerfile: Dockerfile.alert_clean
    container_name: alert-telegram-bridge
    restart: unless-stopped
    networks: [smarthome]
    ports: ["9999:9999"]
    environment:
      - TZ=UTC
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: on-failure:5
    networks: [smarthome]
    ports: ["3000:3000"]
    environment:
      - TZ=UTC
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - /home/milan/docker_data/grafana:/var/lib/grafana
      - /home/milan/docker_data/grafana/provisioning:/etc/grafana/provisioning
      - /home/milan/docker_data/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    networks: [smarthome]
    ports: ["3001:3001"]
    volumes:
      - /home/milan/docker_data/uptime-kuma:/app/data
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.5'

  # === BACKUP ===
  
  duplicati:
    image: linuxserver/duplicati:latest
    container_name: duplicati
    restart: on-failure:3
    networks: [smarthome]
    ports: ["8200:8200"]
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/Berlin
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_ENCRYPTION_KEY}
      CLI_ARGS: "--webservice-password=${DUPLICATI_PASSWORD}"
    volumes:
      - /home/milan/docker_data/duplicati:/config
      - /home/milan/docker_data:/source/docker_data:ro
      - /home/milan/docker-compose.yml:/source/docker-compose.yml:ro
      - /home/milan/.env:/source/.env:ro
      - /home/milan/scripts:/source/scripts:ro
      - /home/milan/backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: '1'

  # === DEVELOPMENT ===
  
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - PASSWORD=${CODE_PASSWORD}
    volumes:
      - /home/milan/docker_data/code-server:/config
      - /home/milan:/config/workspace
    ports:
      - 8443:8443
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Berlin
      - DOCKER_API_VERSION=1.44
    command: --schedule "0 0 4 * * *" --cleanup
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    networks: [smarthome]
    ports: ["9000:9000"]
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  changelog:
    image: nginx:alpine
    container_name: changelog
    restart: unless-stopped
    networks: [smarthome]
    ports: ["8090:80"]
    volumes:
      - ./docker_data/changelog:/usr/share/nginx/html:ro

  milanbuchta:
    image: nginx:alpine
    container_name: milanbuchta
    restart: unless-stopped
    networks: [smarthome]
    ports: ["8092:80"]
    volumes:
      - ./docker_data/milanbuchta:/usr/share/nginx/html:ro
      - ./docker_data/milanbuchta/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  contact-proxy:
    build:
      context: .
      dockerfile: Dockerfile.contact_proxy
    container_name: contact-proxy
    restart: unless-stopped
    networks: [smarthome]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

  gym-tracker-next:
    build: ./gym-tracker-next
    container_name: gym-tracker-next
    restart: unless-stopped
    networks: [smarthome]
    ports: ["3002:3000"]
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DATA_DIR=/app/data
    volumes:
      - ./docker_data/gym-tracker/data:/app/data
      - ./docker_data/gym-tracker/static/uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  gym-tracker:
    build: ./docker_data/gym-tracker
    container_name: gym-tracker
    restart: unless-stopped
    networks: [smarthome]
    ports: ["8091:5000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-set-a-real-64-byte-hex-secret-in-dot-env}
      - LEGACY_ADMIN_USERNAME=${LEGACY_ADMIN_USERNAME:-milan}
      - LEGACY_ADMIN_PASSWORD=${LEGACY_ADMIN_PASSWORD:-admin123}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=Gym Tracker <noreply@milanbuchta.com>
      - CORS_ORIGINS=https://api.milanbuchta.com,http://192.168.0.122:8091,http://100.74.234.99:8091
    volumes:
      - ./docker_data/gym-tracker/data:/app/data
      - ./docker_data/gym-tracker/templates:/app/templates
      - ./docker_data/gym-tracker/static:/app/static
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # cloudflared läuft als systemd service auf dem Host (nicht Docker)
  # sudo systemctl status cloudflared

  # === SYNCTHING & OBSIDIAN ===

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    networks: [smarthome]
    ports:
      - "8384:8384"  # Web UI
      - "22000:22000/tcp"  # Sync protocol
      - "22000:22000/udp"  # Sync protocol UDP
      - "21027:21027/udp"  # Discovery
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /home/milan/docker_data/syncthing:/var/syncthing
      - /home/milan/obsidian-vault:/obsidian-vault
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # === PERFEKTES ZUHAUSE ===
  perfektes-zuhause:
    build: /home/milan/perfektes-zuhause
    container_name: perfektes-zuhause
    restart: unless-stopped
    networks: [smarthome]
    ports:
      - "8093:3000"
    env_file:
      - /home/milan/perfektes-zuhause/.env.local
    environment:
      - NODE_ENV=production

volumes:
  portainer_data:
    driver: local
